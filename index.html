<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Interactive Map</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="info-panel">
      <div class="brand-block">
        <p class="eyebrow">Interactive Community Map</p>
        <h1>Community Map</h1>
        <p class="intro">
          Explore the community clusters and select available units to view their details.
        </p>
      </div>

      <div class="legend">
        <h2>Status Colors</h2>
        <div class="legend-item">
          <span class="legend-swatch legend-rent"></span>
          <span>Available for rent</span>
        </div>
        <div class="legend-item">
          <span class="legend-swatch legend-sale"></span>
          <span>Available for sale</span>
        </div>
        <div class="legend-item">
          <span class="legend-swatch legend-none"></span>
          <span>No information</span>
        </div>
      </div>

      <div class="details-card" id="details-card">
        <h2>Selection Details</h2>
        <div class="details-body" id="details-body">
          <p class="details-empty">No unit selected yet.</p>
        </div>
      </div>
    </aside>

    <main class="map-stage">
      <div class="stage-toolbar">
        <button class="tool-button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="tool-button" id="zoom-out" type="button" aria-label="Zoom out">-</button>
        <button class="tool-button" id="reset-view" type="button" aria-label="Reset view">Reset</button>
      </div>

      <div class="map-frame" id="map-frame">
        <div class="map-surface" id="map-surface">
          <div class="map-glow"></div>

          <img
            id="master-plan"
            src="./assets/master-plan.svg"
            alt="Community master plan"
            draggable="false"
          >

          <svg
            class="cluster-layer"
            id="cluster-layer"
            viewBox="0 0 841.89 595.276"
            preserveAspectRatio="xMidYMid meet"
            aria-label="Community clusters and units"
          >
            <g id="cluster-outline-layer"></g>
            <g id="unit-layer"></g>
          </svg>
        </div>

        <div class="cluster-tooltip" id="cluster-tooltip" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
